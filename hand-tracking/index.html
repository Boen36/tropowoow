<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>tropowoow webXR</title>


    <!-- Javascript tweening engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/16.3.5/Tween.min.js"></script>

    <!-- XR Extras - provides utilities like load screen, almost there, and error handling. -->
    <script src="/tropowoow/hand-tracking/xrextras.js"></script>

    <!-- 8th Wall Open Source Engine -->
    <script async src="/tropowoow/hand-tracking/xr-standalone/xr.js" data-preload-chunks="slam"></script>

    <!-- client code -->
    <script type="module" crossorigin src="/tropowoow/hand-tracking/assets/main-CFaSbX-L.js"></script>
    <link rel="stylesheet" crossorigin href="/tropowoow/hand-tracking/assets/main-BFJcVVvZ.css">
  </head>

  <body>
    <canvas id="camerafeed"></canvas>

    <!-- MediaPipe 模型加载进度遮罩 -->
    <div id="mp-loading-overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.5s ease;">
      <div style="color: white; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 20px;">
        <div style="font-size: 18px; margin-bottom: 16px; font-weight: 500;">正在加载手势识别模型...</div>
        <div id="mp-loading-status" style="font-size: 14px; color: #aaa; margin-bottom: 24px;">初始化中</div>
        <div style="width: 280px; height: 4px; background: rgba(255, 255, 255, 0.2); border-radius: 2px; overflow: hidden;">
          <div id="mp-loading-bar" style="width: 0%; height: 100%; background: #4CAF50; border-radius: 2px; transition: width 0.3s ease;"></div>
        </div>
        <div id="mp-loading-percent" style="font-size: 12px; color: #888; margin-top: 8px;">0%</div>
      </div>
    </div>
  </body>
</html>
